<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loan Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card">
    <h1>Loan Manager</h1>
    <p class="muted">Sign in with your account</p>
    <label>Email<input type="email" name="email" required autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <div id="loginMsg" class="err"></div>
    <button class="btn primary" type="submit">Log in</button>
  </form>
</div>

<div id="shell" class="hidden">
  <header class="top">
    <strong id="brand">Loan Manager</strong>
    <span id="who" class="muted"></span>
    <button id="logout" class="btn sm">Log out</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
